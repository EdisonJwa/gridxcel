name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; there is no publish step.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No dependencies and no build step, so there is nothing to install and
      # nothing to cache: the suite runs the files in src/ exactly as they ship.
      # scripts/run-tests.mjs builds the test file list in Node rather than
      # relying on a glob, so the same "npm test" works on every version and on
      # Windows, where npm scripts run through cmd.exe and nothing expands a
      # pattern for you.
      - name: Test
        run: npm test
      - name: Documentation
        run: npm run check:docs
      - name: Export coverage
        run: npm run check:exports
      # Real bundler and framework integration: esbuild, Vite, React and Preact.
      # It has its own devDependencies and is never published. One leg is enough
      # because it tests build tooling, not Node version behaviour.
      - name: Integration
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: |
          cd integration
          npm install --no-audit --no-fund
          node run-all.mjs
      # The real-browser leg launches an actual Chrome. The runner's preinstalled
      # browser is not at a path we can rely on, so install a known-good one and
      # let it report where. `--with-deps` pulls the shared libraries headless
      # Chrome needs, which a bare runner does not always have.
      - name: Install a browser for the integration leg
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npx --yes playwright@1.49.0 install --with-deps chromium
      # GRIDXCEL_REQUIRE_BROWSER makes a missing browser a FAILURE rather than a
      # skip: a green step that tested nothing is worse than a red one.
      - name: Integration (real browser)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        env:
          GRIDXCEL_REQUIRE_BROWSER: "1"
          CHROME_PATH: /usr/bin/chromium
        run: |
          cd integration
          npm install --no-audit --no-fund
          node real-browser.test.mjs
      - name: Examples
        run: node examples/run-all.mjs
      # The oracle needs python with openpyxl and XlsxWriter. It is the strongest
      # check in the repository - it diffs every read and write path against an
      # independent implementation - so it runs on one leg rather than none.
      - name: Python oracle
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: |
          python -m pip install --quiet openpyxl XlsxWriter
          npm run interop
