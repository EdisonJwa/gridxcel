name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; there is no publish step.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["18", "20", "22", "24"]
        include:
          # Exactly one leg installs the oracle. The rest exercise the skip path,
          # which is the configuration a developer without python actually has.
          - os: ubuntu-latest
            node: "22"
            oracle: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The oracle must be installed BEFORE the suite runs. It was previously set
      # up in a later step, so `npm test` had no openpyxl: every interop suite
      # skipped and one - which called the oracle without a guard - failed.
      # Installing it here means the strongest check in the repository actually
      # runs on the legs that claim to run it.
      - name: Python oracle
        if: matrix.oracle
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet openpyxl XlsxWriter lxml
      # No dependencies and no build step, so there is nothing to install and
      # nothing to cache: the suite runs the files in src/ exactly as they ship.
      # scripts/run-tests.mjs builds the test file list in Node rather than
      # relying on a glob, so the same "npm test" works on every version and on
      # Windows, where npm scripts run through cmd.exe and nothing expands a
      # pattern for you.
      - name: Test
        run: npm test
      - name: Documentation
        run: npm run check:docs
      - name: Export coverage
        run: npm run check:exports
      # Real bundler and framework integration: esbuild, Vite, React and Preact.
      # It has its own devDependencies and is never published. One leg is enough
      # because it tests build tooling, not Node version behaviour.
      - name: Integration
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: |
          cd integration
          npm install --no-audit --no-fund
          # The harness imports the published specifier "gridxcel" on purpose: it
          # is what a consumer writes. That needs node_modules/gridxcel to exist,
          # which it does not on a fresh clone.
          node link-self.mjs
          node run-all.mjs
      # The real-browser leg launches an actual Chrome. The runner's preinstalled
      # browser is not at a path we can rely on, so install a known-good one and
      # let it report where. `--with-deps` pulls the shared libraries headless
      # Chrome needs, which a bare runner does not always have.
      - name: Install browsers for the integration leg
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npx --yes playwright@1.49.0 install --with-deps chromium firefox webkit
      # GRIDXCEL_REQUIRE_BROWSER makes a missing browser a FAILURE rather than a
      # skip: a green step that tested nothing is worse than a red one.
      - name: Integration (real browser)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        env:
          GRIDXCEL_REQUIRE_BROWSER: "1"
          CHROME_PATH: /usr/bin/chromium
        run: |
          cd integration
          npm install --no-audit --no-fund
          node link-self.mjs
          node real-browser.test.mjs
      # The same byte-level API in all three engines. Chromium alone cannot show
      # an engine difference in the Web compression streams that stand in for
      # node:zlib, and that is the part most likely to differ.
      - name: Integration (chromium, firefox, webkit)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        env:
          GRIDXCEL_REQUIRE_BROWSER: "1"
        run: |
          cd integration
          npm install --no-audit --no-fund
          node link-self.mjs
          node cross-browser.test.mjs
          GRIDXCEL_BROWSER_ENGINE=firefox node cross-browser.test.mjs
          GRIDXCEL_BROWSER_ENGINE=webkit node cross-browser.test.mjs
      # The full harness on the leg that has python: it diffs every fixture in
      # both directions, which the node:test copy only partly mirrors.
      - name: Interop harness
        if: matrix.oracle
        run: npm run interop
      - name: Examples
        run: node examples/run-all.mjs
