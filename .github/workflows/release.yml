name: Release

# Publishing from CI rather than a laptop, for three reasons that are all about the
# artifact rather than convenience:
#
#   1. npm provenance needs an OIDC token from a supported CI provider. A local
#      publish cannot produce it, so a laptop release is an unattested release.
#   2. The gate runs on a clean checkout. A local publish runs it on a machine that
#      has untracked fixtures, which is exactly how a doc example that read
#      bench/fair-50000x8.xlsx went green locally and failed all eight CI legs.
#   3. There is no long-lived credential at all: authentication is OIDC, exchanged
#      for a token scoped to this workflow run that cannot be extracted or reused.
#
# Triggered by a tag, not by a push to main: the tag is the release decision, and
# npm versions are immutable, so the decision should be deliberate and recorded.
#
# This workflow uses npm Trusted Publishing (OIDC), not a token. The connection is
# registered against this repository, this filename, and the NPM_TOKEN environment,
# and it is validated by publishing from it once.
#
# Three requirements, each of which fails quietly if missed:
#   - npm >= 11.5.1 and Node >= 22.14.0. The Node 22 image ships npm 10, where OIDC
#     is unsupported and npm falls back to a token - producing an unattested
#     tarball that still reports success. npm is upgraded explicitly below.
#   - id-token: write, or there is no OIDC token to exchange.
#   - NO NODE_AUTH_TOKEN in the environment. A token takes priority over OIDC, so
#     setting one silently disables provenance. A step verifies this.
#
# History, because it cost a run to learn: an earlier version of this workflow
# published with a 2FA-enforcing granular token and failed with EOTP *after* the
# provenance statement had been signed and logged, having uploaded nothing. That is
# what a token-based CI publish looks like when 2FA is on the account; OIDC avoids
# the class entirely by not involving a user credential.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify only, do not publish"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # The npm trusted publisher is registered against this environment name. If the
    # job does not declare it, the OIDC subject that npm receives will not match the
    # configured connection and authentication fails. The name is fixed on npm's
    # side once created ("NPM_TOKEN"), so it is not renamed here.
    environment: NPM_TOKEN
    permissions:
      # Required for provenance: the OIDC token is what npm uses to sign the
      # attestation that this tarball was built from this commit in this workflow.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # full history, so the provenance attestation can name the exact commit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1. The Node 22
          # line ships npm 10.x, so a newer npm is installed below rather than
          # relying on whatever the image happens to carry.
          node-version: "22.14.0"
          # registry-url is deliberately NOT set. It makes setup-node write an
          # .npmrc containing //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          # and export NODE_AUTH_TOKEN as a placeholder, and npm then prefers that
          # token over OIDC - which silently publishes without provenance. npm's
          # default registry is registry.npmjs.org anyway, so nothing is lost.

      # OIDC publishing silently falls back to token auth on older npm, which would
      # produce an unattested tarball while looking successful. Pin it.
      - name: Install a trusted-publishing capable npm
        run: |
          npm install -g npm@^11.5.1
          npm --version

      # The tag and the manifest must agree. Publishing 0.1.0 from a v0.2.0 tag
      # would put a version on the registry that no tag in the repository points
      # at, and npm versions cannot be withdrawn.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e '
            const want = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const have = require("./package.json").version;
            if (want !== have) {
              console.error("tag is v" + want + " but package.json says " + have);
              process.exit(1);
            }
            console.log("tag and package.json agree on " + have);
          '

      - name: Install the Python oracle
        run: |
          python -m pip install --upgrade pip
          python -m pip install openpyxl lxml XlsxWriter

      # Trusted publishing authenticates through OIDC, which npm only uses when no
      # NODE_AUTH_TOKEN is in the environment - a token would take priority and the
      # tarball would be published unattested while still looking successful.
      #
      # So this step deliberately checks that no token is set rather than that one
      # works. Publishing with a token here would silently undo the whole point of
      # the trusted publisher configuration.
      - name: Confirm we are publishing through OIDC, not a token
        if: github.event_name == 'push' || inputs.dry_run == false
        run: |
          failed=0

          # An env token outranks OIDC in npm's own resolution order.
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NODE_AUTH_TOKEN is set in the environment. That takes priority over OIDC and publishes without provenance."
            failed=1
          fi

          # A token can also arrive through .npmrc, which is what setup-node's
          # registry-url option writes. Checking only the env var would miss it.
          for f in "${NPM_CONFIG_USERCONFIG:-}" "$HOME/.npmrc" ".npmrc"; do
            [ -n "$f" ] && [ -f "$f" ] || continue
            if grep -qE '^[^#]*_authToken' "$f" 2>/dev/null; then
              echo "::error::$f contains an _authToken entry. Remove it so npm falls back to OIDC."
              failed=1
            fi
          done

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token request URL. id-token: write is missing, or this runner is not GitHub-hosted (self-hosted runners are not supported)."
            failed=1
          fi

          npm_version=$(npm --version)
          echo "npm version: $npm_version"
          # 11.5.1 is the first version that can exchange an OIDC token at all.
          if [ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -1)" != "11.5.1" ]; then
            echo "::error::npm $npm_version is older than 11.5.1; it cannot use trusted publishing."
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "OIDC is available and no npm token is configured; npm will authenticate through the trusted publisher."

      # prepublishOnly runs this again, but failing here means the log says which
      # gate failed rather than one line of npm output.
      - name: Full gate
        run: npm run check && npm run interop

      # No --provenance flag: trusted publishing generates provenance by default,
      # and passing it is redundant. No NODE_AUTH_TOKEN either, by design.
      #
      # Retried, because the registry is not always available. A 503 or a dropped
      # OIDC exchange is not a defect in this package, and a release should not fail
      # on one. A real rejection (E403, E409, EOTP, a version conflict) is not
      # retried - those are decisions, not weather.
      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == false
        run: |
          set -eu
          attempt=1
          max=4
          while [ "$attempt" -le "$max" ]; do
            echo "::group::npm publish (attempt $attempt of $max)"
            set +e
            npm publish --access public
            status=$?
            set -e
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              echo "Published on attempt $attempt."
              exit 0
            fi

            # Only transient failures are worth another attempt.
            #
            # The pattern has to match the debug log format ("12 error code E503"),
            # not the console format ("npm error code E503") - they differ, and an
            # earlier version of this matched neither and would have retried nothing.
            # Verified against both shapes, plus E403 and E409, which must not retry.
            log=$(ls -t ~/.npm/_logs/*.log 2>/dev/null | head -1)
            reason=""
            if [ -n "$log" ]; then
              reason=$(grep -hE '(error code E5[0-9][0-9]|error code E(NEEDAUTH|TIMEDOUT|CONNRESET|AI_AGAIN)|npm error code (E503|E504|ENEEDAUTH))' "$log" 2>/dev/null | head -4 || true)
            fi

            retryable=0
            case "$reason" in
              *E503*|*E504*|*ETIMEDOUT*|*ECONNRESET*|*EAI_AGAIN*|*ENEEDAUTH*) retryable=1 ;;
            esac

            if [ "$retryable" -ne 1 ]; then
              echo "::error::npm publish failed for a reason that is not transient; not retrying."
              [ -n "$reason" ] && echo "$reason"
              exit 1
            fi

            echo "Transient registry failure; retrying."
            [ -n "$reason" ] && echo "$reason"
            sleep $((attempt * 20))
            attempt=$((attempt + 1))
          done
          echo "::error::npm publish still failing after $max attempts with a transient error."
          exit 1

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != false
        run: npm publish --access public --dry-run

      - name: Record what was published
        if: github.event_name == 'push'
        run: |
          echo "### Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          npm view "$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')" dist.tarball dist.integrity --json >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
